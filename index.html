<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <meta name="author" content="Dustin Bates" />
    <meta
      name="description"
      content="A flashcard app for organizing study decks and reviewing learning materials."
    />
    <meta
      name="keywords"
      content="flashcards, study aids, learning materials, education"
    />

    <title>Flash Cards</title>

    <link rel="icon" href="favicon.ico" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;900&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="assets/css/index.css" />
  </head>

  <body class="page">
    <header class="header">
      <h1 class="header__title">
        <a class="header__link" href="#home">Flash Cards</a>
      </h1>

      <nav class="nav">
        <ul class="nav__links">
          <li>
            <a class="nav__link" href="#home">My Decks</a>
          </li>
          <li>
            <a class="nav__link" href="#about">About</a>
          </li>
        </ul>
      </nav>
    </header>

    <main class="page__main-content">
      <section class="gallery" id="home">
        <h2 class="gallery__title">My Decks</h2>

        <ul class="gallery__list"></ul>

        <template id="deck-template">
          <li class="card">
            <a class="card__link" href="#"></a>
            <h3 class="card__title"></h3>

            <div class="card__row">
              <p class="card__count"></p>
              <button
                class="card__delete-btn"
                type="button"
                aria-label="Delete deck"
              ></button>
            </div>
          </li>
        </template>

        <button class="gallery__new-card-btn" type="button">+ New Deck</button>
      </section>

      <section class="gallery" id="deck" hidden>
        <div class="gallery__bar">
          <h2 class="gallery__title" id="deck-title"></h2>
          <button class="gallery__practice-btn" type="button">Practice</button>
        </div>

        <ul class="gallery__list" id="card-list"></ul>

        <template id="card-template">
          <li class="card">
            <h3 class="card__title"></h3>

            <div class="card__row">
              <a class="card__practice-btn" href="#">Practice</a>
              <button
                class="card__delete-btn"
                type="button"
                aria-label="Delete card"
              ></button>
            </div>
          </li>
        </template>

        <button
          class="gallery__new-card-btn gallery__new-card-btn_location_deck-view"
          type="button"
        >
          + New Card
        </button>
      </section>

      <section class="carousel" id="carousel" hidden>
        <h2 class="carousel__title"></h2>

        <div class="carousel__grid">
          <button
            class="carousel__btn carousel__btn_type_left carousel__btn_disabled"
            type="button"
            aria-label="Go to the previous flashcard"
            disabled
          ></button>

          <div class="carousel__card">
            <p class="carousel__card-text"></p>
          </div>

          <button
            class="carousel__btn carousel__btn_type_right"
            type="button"
            aria-label="Go to the next flashcard"
          ></button>

          <button
            class="carousel__btn carousel__btn_type_flip"
            type="button"
            aria-label="Flip the flashcard"
          ></button>
        </div>
      </section>

      <section class="new-deck-view" id="new-deck-view" hidden>
        <h2 class="new-deck-view__title">New Deck</h2>
        <form class="new-deck-view__form" id="new-deck-form">
          <fieldset class="color-picker">
            <legend class="color-picker__title">Choose a color</legend>
            <div class="color-picker__options">
              <input
                class="color-picker__input"
                type="radio"
                id="green"
                name="color"
                value="#64d583"
                aria-label="Green"
                checked
              />
              <label class="color-picker__label color-picker__label_color_green" for="green"></label>
              <input
                class="color-picker__input"
                type="radio"
                id="blue"
                name="color"
                value="#91a8f9"
                aria-label="Blue"
              />
              <label class="color-picker__label color-picker__label_color_blue" for="blue"></label>
              <input
                class="color-picker__input"
                type="radio"
                id="pink"
                name="color"
                value="#ee92d7"
                aria-label="Pink"
              />
              <label class="color-picker__label color-picker__label_color_pink" for="pink"></label>
              <input
                class="color-picker__input"
                type="radio"
                id="purple"
                name="color"
                value="#aa8ef0"
                aria-label="Purple"
              />
              <label class="color-picker__label color-picker__label_color_purple" for="purple"></label>
              <input
                class="color-picker__input"
                type="radio"
                id="orange"
                name="color"
                value="#ee955e"
                aria-label="Orange"
              />
              <label class="color-picker__label color-picker__label_color_orange" for="orange"></label>
              <input
                class="color-picker__input"
                type="radio"
                id="yellow"
                name="color"
                value="#f5d770"
                aria-label="Yellow"
              />
              <label class="color-picker__label color-picker__label_color_yellow" for="yellow"></label>
            </div>
          </fieldset>

          <label class="new-deck-view__label" for="deck-json">
            Paste your deck JSON
            <textarea
              class="new-deck-view__textarea"
              id="deck-json"
              name="deck-json"
              spellcheck="false"
            ></textarea>
          </label>

          <button class="new-deck-view__submit-btn" type="submit" disabled>
            Create Deck
          </button>
        </form>
      </section>

      <section class="not-found" id="not-found" hidden>
        <h2 class="not-found__title">404 Not Found</h2>
        <p class="not-found__text">The page you requested does not exist.</p>
      </section>
    </main>

    <footer class="footer">
      <p class="footer__text">&copy; 2026 Flash Cards</p>
    </footer>

    <dialog
      class="confirmation-modal"
      id="confirmation-modal"
      aria-labelledby="confirmation-modal-title"
      aria-describedby="confirmation-modal-message"
    >
      <div class="confirmation-modal__content">
        <h2 class="confirmation-modal__title" id="confirmation-modal-title">
          Confirm deletion
        </h2>
        <p
          class="confirmation-modal__message"
          id="confirmation-modal-message"
        ></p>
        <div class="confirmation-modal__actions">
          <button
            class="confirmation-modal__button confirmation-modal__button_type_cancel"
            type="button"
          >
            Cancel
          </button>
          <button
            class="confirmation-modal__button confirmation-modal__button_type_delete"
            type="button"
          >
            Delete
          </button>
        </div>
      </div>
    </dialog>

    <script type="module" src="assets/js/index.js"></script>
  </body>
</html>
